name: eklezya
description: L'application catholique mondiale — Bible, Prières, Liturgie, Saints, IA
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.0
  cached_network_image: ^3.3.0

  # Internationalization
  intl: ^0.19.0

  # UI
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  table_calendar: ^3.0.9
  flutter_markdown: ^0.6.18

  # TTS
  flutter_tts: ^3.8.5

  # Utilities
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # In-app purchases
  purchases_flutter: ^6.24.2

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/
    - assets/audio/
    - assets/animations/

  fonts:
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
